<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ROUTEX - Manage Buses</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family: "Inter", sans-serif;

      background: #f1f5f9;

      color: #172554;

      min-height: 100vh;
    }


    /* NAVBAR */

    .navbar {

      height: 78px;

      background: #10275c;

      color: white;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 28px;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 14px;
    }


    .brand-icon {

      width: 48px;
      height: 48px;

      background: #2458b8;

      border-radius: 12px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 22px;
    }


    .brand h1 {

      font-size: 21px;

      font-weight: 800;
    }


    .brand p {

      font-size: 10px;

      color: #bfdbfe;

      margin-top: 3px;
    }


    .back-btn {

      color: white;

      text-decoration: none;

      padding: 9px 14px;

      background: rgba(255,255,255,.08);

      border: 1px solid rgba(255,255,255,.15);

      border-radius: 8px;

      font-size: 11px;

      font-weight: 600;
    }


    .back-btn:hover {

      background: #2875d8;
    }


    /* MAIN */

    .container {

      max-width: 1200px;

      margin: auto;

      padding: 30px;
    }


    .page-header {

      background: linear-gradient(
        100deg,
        #e0f2fe,
        #eff6ff
      );

      border: 1px solid #c7dff5;

      border-radius: 12px;

      padding: 24px;

      margin-bottom: 20px;
    }


    .page-header h2 {

      color: #12356d;

      font-size: 24px;

      margin-bottom: 6px;
    }


    .page-header p {

      color: #536b89;

      font-size: 12px;
    }


    /* ACTION BAR */

    .action-bar {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 18px;

      gap: 10px;

      flex-wrap: wrap;
    }


    .count {

      font-size: 13px;

      color: #64748b;

      font-weight: 600;
    }


    .add-btn {

      border: none;

      background: #2875d8;

      color: white;

      padding: 11px 17px;

      border-radius: 8px;

      font-family: inherit;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;
    }


    .add-btn:hover {

      background: #1d5fb5;
    }


    /* BUS LIST */

    .bus-list {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 18px;
    }


    .bus-card {

      background: white;

      border: 1px solid #dbe3ec;

      border-radius: 12px;

      padding: 22px;

      box-shadow:
        0 2px 7px rgba(15,23,42,.04);
    }


    .bus-top {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 12px;

      margin-bottom: 16px;
    }


    .bus-info {

      display: flex;

      gap: 12px;

      align-items: center;
    }


    .bus-icon {

      width: 48px;
      height: 48px;

      border-radius: 50%;

      background: #dbeafe;

      color: #2563eb;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .bus-info h3 {

      color: #19396d;

      font-size: 16px;
    }


    .bus-info p {

      color: #64748b;

      font-size: 10px;

      margin-top: 4px;
    }


    .actions {

      display: flex;

      gap: 6px;
    }


    .edit-btn,
    .delete-btn {

      width: 34px;
      height: 34px;

      border: none;

      border-radius: 7px;

      cursor: pointer;

      color: white;
    }


    .edit-btn {

      background: #2875d8;
    }


    .delete-btn {

      background: #dc2626;
    }


    .edit-btn:hover {

      background: #1d5fb5;
    }


    .delete-btn:hover {

      background: #b91c1c;
    }


    .stop-list {

      margin-top: 12px;
    }


    .stop-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 9px 10px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 7px;

      margin-bottom: 6px;

      font-size: 11px;
    }


    .stop-time {

      color: #2875d8;

      font-weight: 700;
    }


    .empty {

      grid-column: 1 / -1;

      text-align: center;

      background: white;

      border: 1px solid #dbe3ec;

      border-radius: 12px;

      padding: 50px;

      color: #64748b;
    }


    /* MODAL */

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(15,23,42,.55);

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }


    .modal-box {

      width: 100%;

      max-width: 650px;

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 14px;

      padding: 25px;
    }


    .modal-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;
    }


    .modal-header h2 {

      color: #12356d;

      font-size: 20px;
    }


    .close {

      border: none;

      background: #f1f5f9;

      width: 34px;
      height: 34px;

      border-radius: 7px;

      cursor: pointer;

      font-size: 17px;

      color: #475569;
    }


    .form-group {

      margin-bottom: 15px;
    }


    .form-group label {

      display: block;

      color: #19396d;

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 6px;
    }


    .form-group input {

      width: 100%;

      padding: 11px;

      border: 1px solid #cbd5e1;

      border-radius: 7px;

      outline: none;

      font-family: inherit;

      font-size: 12px;
    }


    .form-group input:focus {

      border-color: #2875d8;
    }


    /* STOPS EDITOR */

    .stops-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 8px;
    }


    .stops-header h3 {

      font-size: 13px;

      color: #19396d;
    }


    .small-btn {

      border: none;

      background: #e0edff;

      color: #2563eb;

      padding: 6px 10px;

      border-radius: 6px;

      font-size: 10px;

      font-weight: 700;

      cursor: pointer;
    }


    .stop-editor {

      display: grid;

      grid-template-columns: 1fr 120px 35px;

      gap: 7px;

      margin-bottom: 8px;
    }


    .stop-editor input {

      padding: 9px;

      border: 1px solid #cbd5e1;

      border-radius: 6px;

      font-family: inherit;

      font-size: 11px;

      outline: none;
    }


    .remove-stop {

      border: none;

      background: #fee2e2;

      color: #dc2626;

      border-radius: 6px;

      cursor: pointer;
    }


    .save-btn {

      width: 100%;

      border: none;

      background: #2875d8;

      color: white;

      padding: 12px;

      border-radius: 8px;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 15px;
    }


    .save-btn:hover {

      background: #1d5fb5;
    }


    @media (max-width: 850px) {

      .bus-list {

        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 600px) {

      .container {

        padding: 14px;
      }

      .brand p {

        display: none;
      }

      .stop-editor {

        grid-template-columns: 1fr 100px 35px;
      }

    }

  </style>

</head>


<body>


<header class="navbar">

  <div class="brand">

    <div class="brand-icon">

      <i class="fa-solid fa-bus"></i>

    </div>


    <div>

      <h1>🚍 ROUTEX</h1>

      <p>
        AI-Based Smart College Bus Tracking &
        Safety Management System
      </p>

    </div>

  </div>


  <a
    href="admin.html"
    class="back-btn"
  >

    <i class="fa-solid fa-arrow-left"></i>

    Back to Admin Dashboard

  </a>

</header>



<main class="container">


  <section class="page-header">

    <h2>
      <i class="fa-solid fa-bus"></i>
      Bus Management
    </h2>

    <p>
      Add, edit or remove college buses and manage their stops and timings.
    </p>

  </section>



  <div class="action-bar">

    <div
      class="count"
      id="busCount"
    ></div>


    <button
      class="add-btn"
      onclick="openAddBus()"
    >

      <i class="fa-solid fa-plus"></i>

      Add New Bus

    </button>

  </div>



  <section
    class="bus-list"
    id="busList"
  ></section>


</main>



<!-- MODAL -->

<div
  class="modal"
  id="busModal"
>

  <div class="modal-box">


    <div class="modal-header">

      <h2 id="modalTitle">
        Add New Bus
      </h2>


      <button
        class="close"
        onclick="closeModal()"
      >

        <i class="fa-solid fa-xmark"></i>

      </button>

    </div>



    <div class="form-group">

      <label>
        Bus Number
      </label>

      <input
        type="text"
        id="busNumber"
        placeholder="Example: 10"
      >

    </div>



    <div class="form-group">

      <label>
        Route
      </label>

      <input
        type="text"
        id="busRoute"
        placeholder="Example: Chennai → SVCET College"
      >

    </div>



    <div class="stops-header">

      <h3>
        <i class="fa-solid fa-location-dot"></i>
        Bus Stops
      </h3>


      <button
        class="small-btn"
        onclick="addStop()"
      >

        <i class="fa-solid fa-plus"></i>

        Add Stop

      </button>

    </div>



    <div id="stopEditor"></div>



    <button
      class="save-btn"
      onclick="saveBus()"
    >

      <i class="fa-solid fa-floppy-disk"></i>

      Save Bus

    </button>


  </div>

</div>



<script>


/* =====================================================
   DEFAULT DATA
===================================================== */

const defaultBuses = [

  {
    id: "1",

    name: "Bus 01",

    route: "Perambakkam → SVCET College",

    stops: [
      ["Perambakkam", "6:30 AM"],
      ["Kadambathur", "6:50 AM"],
      ["Tiruvallur", "7:10 AM"],
      ["Thirupachur", "7:30 AM"],
      ["SVCET College", "8:00 AM"]
    ]
  },


  {
    id: "6",

    name: "Bus 06",

    route: "Nehru Stadium → SVCET College",

    stops: [
      ["Nehru Stadium", "6:05 AM"],
      ["KMC Hospital", "6:15 AM"],
      ["Anna Arch", "6:30 AM"],
      ["Mogappair", "6:50 AM"],
      ["Maduravoyal", "6:55 AM"],
      ["SVCET College", "8:00 AM"]
    ]
  },


  {
    id: "7",

    name: "Bus 07",

    route: "Madhavaram → SVCET College",

    stops: [
      ["Madhavaram", "5:35 AM"],
      ["Redhills", "5:55 AM"],
      ["Padi", "6:10 AM"],
      ["Padi Jeyachandran", "6:15 AM"],
      ["Anna Nagar", "6:25 AM"],
      ["Tiruvallur", "7:40 AM"],
      ["SVCET College", "8:00 AM"]
    ]
  }

];



/* =====================================================
   LOAD DATA
===================================================== */

function getBuses() {

  const saved =
    localStorage.getItem("routexBuses");


  if (saved) {

    try {

      return JSON.parse(saved);

    } catch (error) {

      console.log(error);

    }

  }


  localStorage.setItem(
    "routexBuses",
    JSON.stringify(defaultBuses)
  );


  return JSON.parse(
    JSON.stringify(defaultBuses)
  );

}



let buses = getBuses();

let editingId = null;



/* =====================================================
   SAVE DATA
===================================================== */

function saveData() {

  localStorage.setItem(
    "routexBuses",
    JSON.stringify(buses)
  );

}



/* =====================================================
   DISPLAY BUS LIST
===================================================== */

function renderBuses() {

  const list =
    document.getElementById("busList");


  const count =
    document.getElementById("busCount");


  count.textContent =
    `${buses.length} bus${buses.length !== 1 ? "es" : ""} available`;


  if (buses.length === 0) {

    list.innerHTML = `

      <div class="empty">

        <i class="fa-solid fa-bus"></i>

        <h3>No buses available</h3>

        <p>
          Click "Add New Bus" to add a bus.
        </p>

      </div>

    `;

    return;

  }



  list.innerHTML = buses.map(bus => `

    <article class="bus-card">


      <div class="bus-top">


        <div class="bus-info">

          <div class="bus-icon">

            <i class="fa-solid fa-bus"></i>

          </div>


          <div>

            <h3>
              ${escapeHTML(bus.name)}
            </h3>

            <p>
              ${escapeHTML(bus.route)}
            </p>

          </div>

        </div>


        <div class="actions">

          <button
            class="edit-btn"
            onclick="editBus('${bus.id}')"
            title="Edit"
          >

            <i class="fa-solid fa-pen"></i>

          </button>


          <button
            class="delete-btn"
            onclick="deleteBus('${bus.id}')"
            title="Delete"
          >

            <i class="fa-solid fa-trash"></i>

          </button>

        </div>

      </div>



      <div class="stop-list">

        ${
          bus.stops.length
          ?

          bus.stops.map((stop, index) => `

            <div class="stop-item">

              <span>

                ${index + 1}.
                ${escapeHTML(stop[0])}

              </span>

              <span class="stop-time">

                ${escapeHTML(stop[1])}

              </span>

            </div>

          `).join("")

          :

          `<div class="stop-item">
            No stops added
          </div>`

        }

      </div>


    </article>

  `).join("");

}



/* =====================================================
   ADD BUS
===================================================== */

function openAddBus() {

  editingId = null;


  document.getElementById("modalTitle").textContent =
    "Add New Bus";


  document.getElementById("busNumber").value = "";

  document.getElementById("busRoute").value = "";


  document.getElementById("stopEditor").innerHTML = "";


  addStop();

  addStop();


  document.getElementById("busModal").style.display =
    "flex";

}



/* =====================================================
   EDIT BUS
===================================================== */

function editBus(id) {

  const bus =
    buses.find(b => b.id === id);


  if (!bus) return;


  editingId = id;


  document.getElementById("modalTitle").textContent =
    "Edit Bus";


  document.getElementById("busNumber").value =
    bus.id;


  document.getElementById("busRoute").value =
    bus.route;


  const editor =
    document.getElementById("stopEditor");


  editor.innerHTML = "";


  bus.stops.forEach(stop => {

    addStop(stop[0], stop[1]);

  });


  document.getElementById("busModal").style.display =
    "flex";

}



/* =====================================================
   ADD STOP
===================================================== */

function addStop(name = "", time = "") {

  const editor =
    document.getElementById("stopEditor");


  const row =
    document.createElement("div");


  row.className =
    "stop-editor";


  row.innerHTML = `

    <input
      type="text"
      class="stop-name-input"
      placeholder="Stop name"
      value="${escapeAttribute(name)}"
    >


    <input
      type="text"
      class="stop-time-input"
      placeholder="6:30 AM"
      value="${escapeAttribute(time)}"
    >


    <button
      class="remove-stop"
      onclick="this.parentElement.remove()"
      title="Remove stop"
    >

      <i class="fa-solid fa-trash"></i>

    </button>

  `;


  editor.appendChild(row);

}



/* =====================================================
   SAVE BUS
===================================================== */

function saveBus() {

  const number =
    document.getElementById("busNumber")
      .value
      .trim();


  const route =
    document.getElementById("busRoute")
      .value
      .trim();


  if (!number) {

    alert("Please enter a bus number.");

    return;

  }


  if (!route) {

    alert("Please enter the bus route.");

    return;

  }



  const stopRows =
    document.querySelectorAll(".stop-editor");


  const stops = [];


  stopRows.forEach(row => {

    const name =
      row.querySelector(".stop-name-input")
        .value
        .trim();


    const time =
      row.querySelector(".stop-time-input")
        .value
        .trim();


    if (name) {

      stops.push([
        name,
        time || "--"
      ]);

    }

  });



  const id =
    number.replace(/^BUS[- ]?/i, "")
      .trim();


  if (!id) {

    alert("Enter a valid bus number.");

    return;

  }



  if (editingId !== null) {

    const index =
      buses.findIndex(
        bus => bus.id === editingId
      );


    if (index !== -1) {

      buses[index] = {

        id: id,

        name: `Bus ${id.padStart(2, "0")}`,

        route: route,

        stops: stops

      };

    }

  }


  else {

    const exists =
      buses.some(
        bus => bus.id === id
      );


    if (exists) {

      alert(
        "This bus number already exists."
      );

      return;

    }


    buses.push({

      id: id,

      name: `Bus ${id.padStart(2, "0")}`,

      route: route,

      stops: stops

    });

  }



  saveData();

  renderBuses();

  closeModal();


  alert(
    "Bus details saved successfully."
  );

}



/* =====================================================
   DELETE BUS
===================================================== */

function deleteBus(id) {

  const bus =
    buses.find(
      item => item.id === id
    );


  if (!bus) return;


  const confirmed =
    confirm(
      `Are you sure you want to remove ${bus.name}?`
    );


  if (!confirmed) {

    return;

  }


  buses =
    buses.filter(
      item => item.id !== id
    );


  saveData();

  renderBuses();


  alert(
    `${bus.name} has been removed.`
  );

}



/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

  document.getElementById("busModal").style.display =
    "none";

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}



/* =====================================================
   INITIAL LOAD
===================================================== */

renderBuses();



/* =====================================================
   UPDATE IF ANOTHER TAB CHANGES BUS DATA
===================================================== */

window.addEventListener(
  "storage",
  function(event) {

    if (event.key === "routexBuses") {

      buses = getBuses();

      renderBuses();

    }

  }
);

</script>


</body>

</html>
