<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ROUTEX - Admin Login</title>


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Inter", sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #050505,
                    #111827,
                    #1d4ed8
                );

            padding: 20px;

        }


        /* =================================================
           LOGIN BOX
           ================================================= */

        .login-box {

            width: 100%;

            max-width: 420px;

            background: #ffffff;

            padding: 40px 35px;

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            animation: loginAppear 0.5s ease;

        }


        /* =================================================
           ADMIN ICON
           ================================================= */

        .admin-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background: #eff6ff;

            color: #2563eb;

            font-size: 30px;

        }


        /* =================================================
           TITLE
           ================================================= */

        h1 {

            text-align: center;

            font-size: 27px;

            font-weight: 800;

            color: #111827;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            margin-top: 7px;

            margin-bottom: 30px;

        }


        /* =================================================
           FORM
           ================================================= */

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #334155;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            font-family: inherit;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);

        }


        /* =================================================
           PASSWORD
           ================================================= */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-right: 65px;

        }


        #togglePassword {

            position: absolute;

            right: 13px;

            top: 13px;

            color: #2563eb;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

        }


        /* =================================================
           LOGIN BUTTON
           ================================================= */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .login-btn:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

        }


        .login-btn i {

            margin-right: 7px;

        }


        /* =================================================
           BACK BUTTON
           ================================================= */

        .back-btn {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 9px;

            background: #e2e8f0;

            color: #334155;

            font-size: 14px;

            cursor: pointer;

        }


        .back-btn:hover {

            background: #cbd5e1;

        }


        /* =================================================
           ERROR
           ================================================= */

        #errorMsg {

            min-height: 20px;

            margin-top: 12px;

            text-align: center;

            color: #dc2626;

            font-size: 13px;

        }


        /* =================================================
           ANIMATION
           ================================================= */

        @keyframes loginAppear {

            from {

                opacity: 0;

                transform: translateY(20px) scale(0.97);

            }

            to {

                opacity: 1;

                transform: translateY(0) scale(1);

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         ADMIN LOGIN
         ================================================= -->

    <div class="login-box">


        <div class="admin-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            ROUTEX Administration
        </p>


        <!-- EMAIL -->

        <label for="adminEmail">
            Admin Email
        </label>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter admin email"
            autocomplete="username"
        >


        <!-- PASSWORD -->

        <label for="adminPassword">
            Password
        </label>


        <div class="password-wrapper">

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
            >

            <span id="togglePassword">
                Show
            </span>

        </div>


        <!-- LOGIN -->

        <button
            class="login-btn"
            id="loginBtn"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>


        <!-- BACK -->

        <button
            class="back-btn"
            onclick="window.location.href='index.html'"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </button>


        <!-- ERROR -->

        <p id="errorMsg"></p>


    </div>



    <!-- =================================================
         AUTH JS
         ================================================= -->

    <script src="auth.js"></script>


    <script>

        // ================================================
        // LOGIN BUTTON
        // ================================================

        document
            .getElementById("loginBtn")
            .addEventListener("click", function () {

                const email =
                    document
                        .getElementById("adminEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("adminPassword")
                        .value;

                const errorMsg =
                    document
                        .getElementById("errorMsg");


                errorMsg.textContent = "";


                if (
                    email === "" ||
                    password === ""
                ) {

                    errorMsg.textContent =
                        "Please enter email and password.";

                    return;

                }


                const success =
                    loginUser(
                        email,
                        password
                    );


                if (!success) {

                    errorMsg.textContent =
                        "Invalid admin email or password.";

                }

            });



        // ================================================
        // ENTER KEY LOGIN
        // ================================================

        document
            .getElementById("adminPassword")
            .addEventListener("keydown", function (event) {

                if (event.key === "Enter") {

                    document
                        .getElementById("loginBtn")
                        .click();

                }

            });



        // ================================================
        // SHOW / HIDE PASSWORD
        // ================================================

        document
            .getElementById("togglePassword")
            .addEventListener("click", function () {

                const password =
                    document
                        .getElementById("adminPassword");


                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    this.textContent = "Hide";

                }

                else {

                    password.type = "password";

                    this.textContent = "Show";

                }

            });

    </script>


</body>

</html>
